# APT Smart Grid Attack — Default Scenario
# ==========================================
# Multi-stage APT targeting HES/MDMS infrastructure
# Maps to MITRE ATT&CK for ICS kill-chain
#
# Timing: 5-minute compressed demo representing ~10 days of real-time activity.
# Each stage runs in sequence; the engine manages transitions.

name: "credential_intrusion"
title: "Credential Intrusion"
description: "External attacker phishes an admin credential, enters via VPN, and moves laterally to grid systems."
narrative: "A hacker from the outside steals an employee's password. They use this password to sneak into the company's network, quietly move around, and eventually send a malicious command to disconnect electricity meters in certain areas."
duration_minutes: 4
time_compression: 240

graph_config:
  origin: "external"
  compromised_identity: "operator1"
  c2_node: "c2_host"

detection_weights:
  login_anomaly: 1.0
  graph_anomaly: 1.0
  beacon_detection: 1.0
  isolation_forest: 1.0
  mass_command: 1.0
  physical_tamper: 1.0

stages:
  # ──────────────────────────────────────────────────────────────
  # Stage 1: Reconnaissance (T0846 — Remote System Discovery)
  # ──────────────────────────────────────────────────────────────
  - name: reconnaissance
    technique_id: T0846
    tactic: Discovery
    description: "Attacker scans HES endpoints to map the attack surface"
    start_offset_seconds: 0
    delay_after: 3
    config:
      target_endpoints:
        - "/api/health"
        - "/api/meters"
        - "/api/auth/login"
        - "/api/operators"
        - "/api/fleet/status"
        - "/api/audit/logins"
        - "/docs"

  # ──────────────────────────────────────────────────────────────
  # Stage 1.5: Physical Tampering (T0834 — Hardware)
  # ──────────────────────────────────────────────────────────────
  - name: physical_tampering
    technique_id: T0834
    tactic: Initial Access
    description: "Physical optical port access to inject malicious token"
    start_offset_seconds: 20
    delay_after: 3
    config:
      target_meter: "SM-A-0001"
      token: "2938 1234 9876 5432 1098"

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Initial Access (T0859 — Valid Accounts)
  # ──────────────────────────────────────────────────────────────
  - name: initial_access
    technique_id: T0859
    tactic: Initial Access
    description: "Credential stuffing against HES operator login"
    start_offset_seconds: 30
    delay_after: 3
    config:
      target_url: "/api/auth/login"
      wordlist:
        - "password"
        - "123456"
        - "admin"
        - "grid2024"
        - "admin123"
      target_users:
        - "operator1"
        - "admin"

  # ──────────────────────────────────────────────────────────────
  # Stage 3: Persistence (T1098 — Account Manipulation)
  # ──────────────────────────────────────────────────────────────
  - name: persistence
    technique_id: T1098
    tactic: Persistence
    description: "Create rogue admin account in MDMS for backdoor access"
    start_offset_seconds: 75
    delay_after: 3
    config:
      rogue_account:
        username: "svc_backup"
        password: "Sup3rS3cur3!"
        role: "admin"

  # ──────────────────────────────────────────────────────────────
  # Stage 4: Lateral Movement (T0886 — Remote Services)
  # ──────────────────────────────────────────────────────────────
  - name: lateral_movement
    technique_id: T0886
    tactic: Lateral Movement
    description: "Pivot from HES to MDMS and exfiltrate customer data"
    start_offset_seconds: 105
    delay_after: 3
    config:
      target_apis:
        - "/api/customers"
        - "/api/billing/CUST-A-0001"
        - "/api/reports/consumption"
        - "/api/operators"
        - "/api/audit"

  # ──────────────────────────────────────────────────────────────
  # Stage 5: Command & Control (T0869 — Standard App Layer Protocol)
  # ──────────────────────────────────────────────────────────────
  - name: command_control
    technique_id: T0869
    tactic: Command and Control
    description: "Low-and-slow beacon via fake meter telemetry"
    start_offset_seconds: 145
    duration_seconds: 30
    delay_after: 3
    config:
      beacon_interval_seconds: 47
      beacon_jitter_seconds: 5
      fake_meter_id: "SM-X-9999"

  # ──────────────────────────────────────────────────────────────
  # Stage 6: Impact (T0826 — Loss of Availability)
  # ──────────────────────────────────────────────────────────────
  - name: impact
    technique_id: T0826
    tactic: Impact
    description: "Mass meter disconnect — cascading blackout"
    start_offset_seconds: 205
    delay_after: 0
    config:
      disconnect_batch_size: 100
      batch_delay_seconds: 1
      zone_order:
        - "A"
        - "B"
